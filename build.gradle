/*
 * This file was generated by the Gradle 'init' task.
 */
plugins {
    id 'java'
    id 'maven-publish'
    id 'eclipse'
    id 'org.springframework.boot' version '2.7.18'
}
apply plugin: "io.spring.dependency-management"

// Explicitly set the main class to avoid ASM version issues with JDK 21
bootJar {
    mainClass = 'org.apache.fineract.ServerApplication'
    enabled = true
    archiveClassifier = '' // This ensures bootJar replaces the default jar
}

springBoot {
    mainClass = 'org.apache.fineract.ServerApplication'
}

// Disable the default jar task to avoid confusion
jar {
    enabled = false
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/phee-gradle-local')
    }
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/mifosx-gradle-local')
    }
    mavenCentral()
}

ext {
    springBootVersion = '2.7.18'
}

dependencies {
    implementation 'org.springframework.security:spring-security-jwt:1.1.1.RELEASE'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.security.oauth:spring-security-oauth2:2.5.2.RELEASE'
    implementation 'org.json:json:20190722'
    implementation 'org.eclipse.persistence:org.eclipse.persistence.jpa:2.7.15'
    implementation 'org.hibernate:hibernate-jpamodelgen:5.6.15.Final'
    annotationProcessor 'org.hibernate:hibernate-jpamodelgen:5.6.15.Final'
    implementation 'joda-time:joda-time:2.10.6'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'com.zaxxer:HikariCP'
    implementation 'mysql:mysql-connector-java:8.0.33'
    implementation 'com.googlecode.flyway:flyway-core:2.1.1'
    implementation 'net.sf.ehcache:ehcache:2.10.6'
    testImplementation 'junit:junit:4.13.2'
    implementation 'net.sf.supercsv:super-csv:2.4.0'
    implementation 'com.amazonaws:aws-java-sdk:1.11.486'
    implementation 'com.azure:azure-storage-blob:12.12.0'
    implementation 'commons-io:commons-io:2.4'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    implementation "org.springdoc:springdoc-openapi-ui:1.7.0"
    // implementation 'org.mifos:ph-ee-connector-common:1.4.1-SNAPSHOT'
    implementation 'org.mifos:ph-ee-connector-common:1.4.1-gazelle'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}

// is the group correct or should be org.mifos ?? 
group = 'org.apache.fineract'
version = '2.0.0.mifos-SNAPSHOT'
description = 'ph-ee-operations-app'
sourceCompatibility = '21'
targetCompatibility = '21'

sourceSets {
    generated {
        java {
            srcDirs = ['src/generated/java']
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.generatedSourceOutputDirectory = file("src/generated/java")
    options.release = 21
    options.compilerArgs.addAll([
        '-parameters'
    ])
}

test {
    useJUnit()
}